# Publica el repositorio pacman [okaru] (okaru-core, okaru, okaru-greeter y las apps, firmados) en el release fijo "repo":
#   Server = https://github.com/MrAndyVF/okaru/releases/download/repo
# Secretos: OKARU_GPG_PRIVATE_KEY (llave privada en ASCII, sin frase) y OKARU_GPG_KEY_ID (huella).
# Solo a mano y desde main (por seguridad): ni fusiones ni etiquetas lo disparan. Antes de lanzarlo, VERSION
# debe tener su etiqueta vX.Y.Z subida y su sección en CHANGELOG.md. Cada app se compila desde la última etiqueta
# vX.Y.Z de su repo (MrAndyVF/okaru-<app>): para publicar una app nueva, se etiqueta allí y se lanza este flujo.
# Siempre se compila todo: las apps dependen de la versión exacta del núcleo y ccache hace barato lo que no cambió.
name: publicar

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  repo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      GH_TOKEN: ${{ github.token }}
      KEY_ID: ${{ secrets.OKARU_GPG_KEY_ID }}
      OKARU_APPS: okaru-calc okaru-view okaru-play okaru-edit okaru-pdf okaru-files okaru-archive
    steps:
      - name: Herramientas
        run: |
          pacman -Syu --noconfirm --needed git github-cli ccache mold >/dev/null
          # makepkg con ccache y mold: lo que no cambió desde la última publicación no se recompila.
          sed -i 's/!ccache/ccache/' /etc/makepkg.conf
          echo 'LDFLAGS+=" -fuse-ld=mold"' >> /etc/makepkg.conf
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: okaru
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: MrAndyVF/okaru-greeter
          path: okaru-greeter
          fetch-depth: 0
      - name: Apps en su última etiqueta
        run: |
          for app in $OKARU_APPS; do
            git clone -q "https://github.com/MrAndyVF/$app" "$app"
            tag=$(git -C "$app" tag -l 'v*' --sort=-v:refname | head -1)
            [ -n "$tag" ] || { echo "::error::$app no tiene etiquetas vX.Y.Z."; exit 1; }
            # El PKGBUILD de la app clona la rama main del checkout: main apunta a la etiqueta que se publica.
            git -C "$app" checkout -q -B main "$tag"
            echo "$app $tag"
          done
      - name: Caché de compilación
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-publicar-${{ github.sha }}
          restore-keys: ccache-publicar-
      - name: Versión, etiqueta y changelog
        # Falla antes de compilar si VERSION no tiene su etiqueta o sus notas en CHANGELOG.md.
        run: |
          version=$(cat okaru/VERSION)
          git -c safe.directory='*' -C okaru rev-parse -q --verify "refs/tags/v$version" >/dev/null \
            || { echo "::error::Falta la etiqueta v$version (VERSION) en el repositorio."; exit 1; }
          bash okaru/tools/changelog-section.sh "$version" okaru/CHANGELOG.md >/dev/null
      - name: Usuario de compilación y llave de firma
        env:
          GPG_PRIVATE_KEY: ${{ secrets.OKARU_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$KEY_ID" ]; then
            echo "::error::Faltan los secretos OKARU_GPG_PRIVATE_KEY y OKARU_GPG_KEY_ID."
            exit 1
          fi
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          mkdir -p "$CCACHE_DIR"
          chown -R builder: "$GITHUB_WORKSPACE"
          printf '%s\n' "$GPG_PRIVATE_KEY" | sudo -u builder gpg --batch --import
      - name: Compilar y firmar los paquetes
        run: |
          mkdir -p out && chown builder: out
          # El PKGBUILD clona la rama main del checkout; se asegura que exista y apunte al commit que se publica.
          sudo -u builder git -C "$GITHUB_WORKSPACE/okaru" checkout -q -B main
          build() { # $1 = repo; su PKGBUILD lee la ruta del checkout de <REPO en mayúsculas>_REPO
            local dir="$GITHUB_WORKSPACE/build-$1" var
            var=$(echo "$1" | tr 'a-z-' 'A-Z_')_REPO
            sudo -u builder mkdir -p "$dir"
            sudo -u builder cp "$GITHUB_WORKSPACE/$1/packaging/arch/PKGBUILD" "$dir/"
            (cd "$dir" && sudo -u builder env \
              CCACHE_DIR="$CCACHE_DIR" CCACHE_BASEDIR="$dir" CCACHE_COMPRESS=1 CCACHE_MAXSIZE=3G \
              "$var=$GITHUB_WORKSPACE/$1" \
              PKGDEST="$GITHUB_WORKSPACE/out" GPGKEY="$KEY_ID" \
              makepkg --syncdeps --noconfirm --sign)
          }
          build okaru
          build okaru-greeter
          # Las apps se compilan contra el núcleo recién hecho (y dependen de esa versión exacta).
          # pacman verifica la firma (.sig junto al paquete): necesita la llave pública de [okaru] en su llavero.
          pacman-key --init >/dev/null 2>&1
          pacman-key --add okaru/packaging/keys/okaru.asc >/dev/null
          pacman-key --lsign-key "$KEY_ID" >/dev/null
          pacman -U --noconfirm out/okaru-core-*.pkg.tar.zst >/dev/null
          for app in $OKARU_APPS; do
            chown -R builder: "$GITHUB_WORKSPACE/$app"
            build "$app"
          done
          sudo -u builder env CCACHE_DIR="$CCACHE_DIR" ccache -s
      - name: Base de datos del repositorio
        working-directory: out
        run: |
          sudo -u builder repo-add --sign --key "$KEY_ID" okaru.db.tar.zst ./*.pkg.tar.zst
          # Los releases no guardan enlaces simbólicos: okaru.db y okaru.files van como copias.
          for f in okaru.db okaru.db.sig okaru.files okaru.files.sig; do
            cp --remove-destination "$(readlink -f "$f")" "$f"
          done
          ls -la
      - name: Publicar en el release "repo"
        working-directory: out
        run: |
          repo="$GITHUB_REPOSITORY"
          # Título "Okaru <versión>" con la versión de VERSION.
          version=$(cat "$GITHUB_WORKSPACE/okaru/VERSION")
          notes="Repositorio [okaru] para pacman. Instala con install.sh; no descargues estos archivos a mano."
          if gh release view repo -R "$repo" >/dev/null 2>&1; then
            # gh release edit envía más campos y la API responde 500 con este release; basta el nombre.
            id=$(gh release view repo -R "$repo" --json databaseId --jq .databaseId)
            gh api -X PATCH "repos/$repo/releases/$id" -f name="Okaru $version" >/dev/null
          else
            gh release create repo -R "$repo" --title "Okaru $version" --latest=false --notes "$notes"
          fi
          # Se quitan los paquetes de versiones anteriores para que el release no crezca sin límite.
          for asset in $(gh release view repo -R "$repo" --json assets --jq '.assets[].name'); do
            [ -e "$asset" ] || gh release delete-asset repo "$asset" -R "$repo" --yes
          done
          gh release upload repo -R "$repo" --clobber ./*.pkg.tar.zst ./*.pkg.tar.zst.sig \
            okaru.db okaru.db.sig okaru.files okaru.files.sig okaru.db.tar.zst okaru.db.tar.zst.sig \
            okaru.files.tar.zst okaru.files.tar.zst.sig
      - name: Release de la versión con su changelog
        run: |
          repo="$GITHUB_REPOSITORY"
          src="$GITHUB_WORKSPACE/okaru"
          version=$(cat "$src/VERSION")
          bash "$src/tools/changelog-section.sh" "$version" "$src/CHANGELOG.md" > notes.md
          if gh release view "v$version" -R "$repo" >/dev/null 2>&1; then
            id=$(gh release view "v$version" -R "$repo" --json databaseId --jq .databaseId)
            gh api -X PATCH "repos/$repo/releases/$id" -f name="Okaru $version" -F body=@notes.md >/dev/null
          else
            gh release create "v$version" -R "$repo" --verify-tag --title "Okaru $version" --notes-file notes.md --latest
          fi
