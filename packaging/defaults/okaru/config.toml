# OKARU — configuración de fábrica (la deja el instalador). Referencia de opciones: okaru config export full
# Los cambios hechos desde Ajustes van a ~/.local/state/okaru/settings.toml y tienen prioridad sobre este archivo.

[bar.default]
background_opacity = 0.7
start = [ "workspaces", "media" ]
center = [ "clock", "weather" ]
end = [ "tray", "cat", "phone", "input_volume", "capture", "control-center" ]

    # Scroll sobre las zonas vacías de la barra cambia de espacio de trabajo
    [bar.default.dead_zone.actions]
    scroll_up = "workspace-switch prev"
    scroll_down = "workspace-switch next"

[widget.clock]
format = "{:%I:%M %p  %a %b %d}"

[widget.weather]
show_condition = false

[widget.media]
hide_when_no_media = true
max_length = 300
title_scroll = "on_hover"

[widget.cat]
type = "cat"
show_cpu_percent = true

[widget.capture]
quality = "ultra"
resolution = "1920x1080"

[widget.tray]
detached_panel = true
drawer = true
drawer_columns = 5
match_adjacent_spacing = true

[widget.control-center]
glyph = "settings"

[[control_center.cards]]
size = "large"
type = "profile"

[[control_center.cards]]
size = "large"
type = "microphone"

[[control_center.cards]]
size = "large"
type = "volume"

[[control_center.cards]]
size = "large"
type = "brightness"

[[control_center.cards]]
size = "medium"
type = "shortcut:wifi"

[[control_center.cards]]
size = "medium"
type = "shortcut:bluetooth"

[[control_center.cards]]
size = "small"
type = "shortcut:caffeine"

[[control_center.cards]]
size = "small"
type = "shortcut:notification"

[[control_center.cards]]
size = "small"
type = "shortcut:power_profile"

[[control_center.cards]]
size = "small"
type = "session"

[shell]
launch_apps_as_systemd_services = true
polkit_agent = true
app_icon_color = "primary"
font_family = "JetBrainsMono Nerd Font"
font_weight = 700
password_style = "random"
screen_time_enabled = true
settings_window_translucent = true

    [shell.animation]
    style = "fluid"

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    default_view = "all"
    sort_by_usage = false

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"
    wallpaper_placement = "floating"

    [shell.screenshot]
    confirm_region = true

    [shell.session]
    grid = true

[theme]
mode = "light"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"
pure_black_dark = true

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "hyprtoolkit", "kcolorscheme", "kitty", "qt" ]
    community_ids = [
        "claude-code",
        "zen-browser",
        "discord",
        "libreoffice",
        "micro",
        "neovim",
        "zed",
        "heroiclauncher",
        "prismlauncher",
        "steam",
        "fastfetch",
        "papirus-icons",
        "starship"
    ]

[wallpaper]
transition = [ "disc" ]
transition_on_startup = true

[lockscreen]
transition = [ "disc" ]

[dock]
auto_hide = false
background_opacity = 0.5
border = "primary_container"
border_width = 1.5
cross_axis_padding = 6
icon_size = 32
item_spacing = 6
launcher_position = "start"
margin_edge = 10
pinned = [ "org.gnome.Nautilus", "firefox", "kitty", "org.localsend.localsend_app" ]
reserve_space = true
show_dots = true
show_running = true
smart_auto_hide = false

[notification]
background_opacity = 0.75
border_color = "primary"

[osd]
background_opacity = 0.7
border_color = "primary"
hide_delay_ms = 1000
position_vertical = "center_right"

[bluetooth]
connect_when_enabled = true

[location]
auto_locate = true

[idle]
behavior_order = [ "lock", "screen-off", "idle-behavior" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 420.0

    [idle.behavior.idle-behavior]
    action = "suspend"
    enabled = true
    lock_before_suspend = false
    timeout = 600.0
