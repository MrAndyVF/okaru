<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- OKARU: JetBrainsMono Nerd Font como fuente por defecto del sistema (interfaz, serif y monoespaciada).
     La copia el instalador a ~/.config/fontconfig/conf.d/; bórrala para volver a las fuentes de tu distro. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>
