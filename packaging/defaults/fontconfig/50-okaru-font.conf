<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- OKARU: JetBrainsMono Nerd Font como fuente por defecto del sistema (interfaz, serif y monoespaciada).
     La copia el instalador a ~/.config/fontconfig/conf.d/; bórrala para volver a las fuentes de tu distro. -->
<fontconfig>
  <!-- Las fuentes estándar de PDF van a Liberation (mismas medidas): con JetBrains, los PDF que no las incrustan
       (formularios, sobre todo) salían con letras separadas y glifos perdidos. -->
  <match target="pattern">
    <test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Courier</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Courier New</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit>
  </match>
  <!-- Símbolos de los PDF (marcas de casillas y viñetas): D050000L de gsfonts. -->
  <match target="pattern">
    <test name="family"><string>ZapfDingbats</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>D050000L</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Dingbats</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>D050000L</string></edit>
  </match>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>
